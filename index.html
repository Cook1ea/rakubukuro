<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>落袋收益</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="落袋收益">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="180x180" href="https://cook1ea.github.io/rakubukuro/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="theme-color" content="#16244a">
<script>
  // 从主屏幕图标启动时(standalone)直接跳转;在 Safari 里打开时停留,方便「添加到主屏幕」
  var APP = 'https://script.google.com/macros/s/AKfycbya9LuIJ8CFrLiXB8ia7Q_KKTYFhLbuLyB7PwKTI0QxBWnY-aOIblZvWD0PaSn9j6f2_g/exec';
  var standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
  if (standalone) location.replace(APP);
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #16244a; color: #e9edf7;
    font: 16px/1.6 -apple-system, "Hiragino Sans", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 110px; border-radius: 24px; display: block; margin: 0 auto 16px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  h1 { font-size: 22px; margin: 0 0 18px; color: #f0be50; }
  .steps { background: rgba(255,255,255,.07); border-radius: 14px; padding: 14px 18px; text-align: left; margin-bottom: 20px; }
  a.btn { display: inline-block; background: #f0be50; color: #16244a; text-decoration: none; font-weight: 600;
    padding: 12px 28px; border-radius: 12px; }
</style>
</head>
<body>
  <div>
    <img src="icon-180.png?v=2" alt="">
    <h1>落袋收益</h1>
    <div class="steps">
      添加到主屏幕:<br>
      1. 点 Safari 底部的 <b>分享</b> 按钮<br>
      2. 选 <b>添加到主屏幕</b><br>
      之后从主屏幕图标打开会直接进入。
    </div>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbya9LuIJ8CFrLiXB8ia7Q_KKTYFhLbuLyB7PwKTI0QxBWnY-aOIblZvWD0PaSn9j6f2_g/exec">打开落袋收益</a>
  </div>
</body>
</html>
